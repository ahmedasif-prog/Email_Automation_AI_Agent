<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Drafter</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --paper: #f6f2ea;
    --ink: #2b2620;
    --rule: #d8cfbd;
    --accent: #3d5a4c;
    --accent-soft: #e7ede9;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }
  header .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: #7a7263;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
  }
  section {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #doc-pane {
    border-right: 1px solid var(--rule);
    padding: 22px 28px;
  }
  #doc-pane h2, #chat-pane h2 {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #7a7263;
    margin: 0 0 12px;
  }
  #doc-content {
    flex: 1;
    background: #fffdf9;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 18px 20px;
    white-space: pre-wrap;
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.65;
  }
  #doc-content:empty::before {
    content: "Nothing drafted yet. Ask the assistant to write something.";
    color: #a39a89;
    font-style: italic;
  }
  #chat-pane { padding: 22px 28px; }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-right: 4px;
  }
  .msg {
    max-width: 90%;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fdfcf8;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--accent-soft);
    border-bottom-left-radius: 2px;
  }
  .msg.tool {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 12px;
    color: #5b6b62;
    background: transparent;
    border: 1px dashed var(--rule);
    padding: 6px 10px;
  }
  form {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }
  textarea {
    flex: 1;
    resize: none;
    height: 54px;
    padding: 10px 12px;
    font-family: var(--serif);
    font-size: 14.5px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fffdf9;
    color: var(--ink);
  }
  textarea:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--accent);
    color: #fdfcf8;
    border: none;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint {
    font-family: var(--mono);
    font-size: 11px;
    color: #9a917f;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <header>
    <h1>Drafter</h1>
    <span class="tag">write · save · send</span>
  </header>
  <main>
    <section id="doc-pane">
      <h2>Current document</h2>
      <div id="doc-content"></div>
    </section>
    <section id="chat-pane">
      <h2>Assistant</h2>
      <div id="messages"></div>
      <form id="chat-form">
        <textarea id="chat-input" placeholder="e.g. Write an email to my professor asking for an extension..." required></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
      
    </section>
  </main>

<script>
const SESSION_ID = "default";
const messagesEl = document.getElementById("messages");
const docEl = document.getElementById("doc-content");
const form = document.getElementById("chat-form");
const input = document.getElementById("chat-input");
const sendBtn = document.getElementById("send-btn");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setDocument(text) {
  docEl.textContent = text || "";
}

async function loadDocument() {
  const res = await fetch(`/document?session_id=${SESSION_ID}`);
  const data = await res.json();
  setDocument(data.document);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage("user", message);
  input.value = "";
  sendBtn.disabled = true;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: SESSION_ID, message }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage("assistant", "Error: " + (err.detail || res.statusText));
      return;
    }
    const data = await res.json();
    for (const evt of data.tool_events || []) {
      addMessage("tool", evt);
    }
    addMessage("assistant", data.reply || "(no reply)");
    setDocument(data.document);
  } catch (err) {
    addMessage("assistant", "Network error: " + err.message);
  } finally {
    sendBtn.disabled = false;
  }
});

loadDocument();
</script>
</body>
</html>
